<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Eastman - Software Engineer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load React -->
    <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <!-- Lucide Icons (from CDN via unpkg for React) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .tab-active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
        }

        .feature-card {
            transition: all 0.2s ease-in-out;
        }

        .feature-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-color: #3b82f6;
        }

        .gradient-text {
            background: linear-gradient(to right, #2563eb, #9333ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body>
    <div id="root">Loading...</div>

    <script type="text/babel">
        const { useState } = React;

        // --- MOCK DATA ---
        const PORTFOLIO_DATA = {
            about: {
                name: "John Eastman",
                title: "Software Engineer",
                bio: "I'm a passionate software engineer specializing in building robust, data-driven applications. With a background in developing complex systems like market analytics tools and automated bots, I thrive on solving difficult technical challenges and creating intuitive user experiences. I enjoy working across the stack, from React frontends to high-performance Python backends.",
                skills: ["React", "JavaScript/TypeScript", "Python", "FastAPI", "PostgreSQL", "Docker", "Tailwind CSS"],
                socials: [
                    { name: "GitHub", url: "https://github.com", icon: "github" },
                    { name: "LinkedIn", url: "https://linkedin.com", icon: "linkedin" },
                    { name: "Twitter", url: "https://twitter.com", icon: "twitter" }
                ]
            },
            blogPosts: [
                {
                    id: 1,
                    title: "Rebuilding My Portfolio with React & Tailwind",
                    date: "Feb 27, 2026",
                    readTime: "5 min read",
                    category: "Web Development",
                    snippet: "A look into how I transitioned from a complex market analytics tool into a sleek, purely static personal site using React via CDN and Tailwind CSS."
                },
                {
                    id: 2,
                    title: "Optimizing Vector Searches with pgvector",
                    date: "Jan 15, 2026",
                    readTime: "8 min read",
                    category: "Database",
                    snippet: "Deep dive into implementing an efficient vector search system using HNSW indexing to instantly match news articles with prediction markets."
                },
                {
                    id: 3,
                    title: "Simulating Arbitrage Opportunities",
                    date: "Dec 10, 2025",
                    readTime: "6 min read",
                    category: "Algorithms",
                    snippet: "Breaking down the math and optimization logic required to find risk-free profit opportunities across multiple disparate event contract markets."
                }
            ],
            projects: [
                {
                    id: "p1",
                    title: "Kalshi Market Tools",
                    description: "An advanced analytics dashboard providing orderbook visualizations, volume velocity analysis, and market impact simulations for event contract traders.",
                    tags: ["React", "Recharts", "FastAPI", "WebSockets"],
                    links: [{ label: "Demo", url: "#" }, { label: "Source", url: "#" }],
                    color: "blue"
                },
                {
                    id: "p2",
                    title: "NHL Arbitrage Bot",
                    description: "Automated simulation engine that calculates complex fee structures and optimizes budget allocation between complementary sports betting markets to maximize guaranteed returns.",
                    tags: ["Python", "Pandas", "Financial Math"],
                    links: [{ label: "Source", url: "#" }],
                    color: "purple"
                },
                {
                    id: "p3",
                    title: "Semantic News Matcher",
                    description: "A machine-learning powered pipeline that ingests real-time news data, generates embeddings, and uses pgvector to semantically link articles to relevant prediction markets.",
                    tags: ["PostgreSQL", "pgvector", "OpenAI Embeddings"],
                    links: [{ label: "Case Study", url: "#" }],
                    color: "green"
                },
                {
                    id: "p4",
                    title: "Railway Deployment Pipeline",
                    description: "Configured a robust CI/CD pipeline and cloud infrastructure using Docker, Neon databases, and connection poolers to ensure high availability for a heavily trafficked web app.",
                    tags: ["Docker", "Railway", "Neon", "DevOps"],
                    links: [{ label: "Source", url: "#" }],
                    color: "orange"
                }
            ]
        };

        // --- COMPONENTS ---

        function AboutMe({ data }) {
            return (
                <div className="max-w-4xl mx-auto animate-fade-in">
                    <div className="bg-white rounded-xl shadow-sm p-8 mb-8 border border-gray-100 flex flex-col md:flex-row gap-8 items-center md:items-start">
                        {/* Profile Avatar Placeholder */}
                        <div className="w-48 h-48 rounded-full bg-gradient-to-br from-blue-100 to-purple-100 flex-shrink-0 flex items-center justify-center border-4 border-white shadow-lg overflow-hidden">
                            <span className="text-6xl text-blue-300 font-bold">{data.name.charAt(0)}</span>
                        </div>

                        <div className="flex-1 text-center md:text-left">
                            <h2 className="text-3xl font-bold text-gray-900 mb-2">{data.name}</h2>
                            <h3 className="text-xl gradient-text font-semibold mb-4">{data.title}</h3>
                            <p className="text-gray-600 leading-relaxed mb-6 text-lg">
                                {data.bio}
                            </p>

                            <div className="flex flex-wrap gap-4 justify-center md:justify-start">
                                {data.socials.map((social, idx) => (
                                    <a
                                        key={idx}
                                        href={social.url}
                                        className="px-6 py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-lg text-gray-700 font-medium transition-colors focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >
                                        {social.name}
                                    </a>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm p-8 border border-gray-100">
                        <h3 className="text-xl font-bold text-gray-900 mb-6 flex items-center">
                            <span className="bg-blue-100 text-blue-600 p-2 rounded-lg mr-3">💻</span>
                            Core Technologies
                        </h3>
                        <div className="flex flex-wrap gap-3">
                            {data.skills.map((skill, idx) => (
                                <span key={idx} className="px-4 py-2 bg-blue-50 text-blue-700 rounded-full font-medium text-sm border border-blue-100">
                                    {skill}
                                </span>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function Blog({ posts }) {
            return (
                <div className="max-w-4xl mx-auto animate-fade-in">
                    <h2 className="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                        <span className="bg-purple-100 text-purple-600 p-2 rounded-lg mr-3">✍️</span>
                        Recent Writing
                    </h2>
                    <div className="space-y-6">
                        {posts.map(post => (
                            <article key={post.id} className="feature-card bg-white p-6 rounded-xl shadow-sm border border-gray-200 cursor-pointer">
                                <div className="flex justify-between items-start mb-3">
                                    <span className="text-xs font-semibold px-3 py-1 bg-gray-100 text-gray-600 rounded-full uppercase tracking-wider">
                                        {post.category}
                                    </span>
                                    <div className="text-sm text-gray-500 flex items-center gap-3">
                                        <time>{post.date}</time>
                                        <span>•</span>
                                        <span>{post.readTime}</span>
                                    </div>
                                </div>
                                <h3 className="text-xl font-bold text-gray-900 mb-3 hover:text-blue-600 transition-colors">
                                    {post.title}
                                </h3>
                                <p className="text-gray-600 leading-relaxed">
                                    {post.snippet}
                                </p>
                                <div className="mt-4 flex items-center text-blue-600 font-medium text-sm hover:text-blue-800">
                                    Read Article
                                    <span className="ml-1">→</span>
                                </div>
                            </article>
                        ))}
                    </div>

                    <div className="mt-8 text-center">
                        <button className="px-6 py-3 border-2 border-gray-200 rounded-lg text-gray-600 font-medium hover:bg-gray-50 transition-colors">
                            View All Posts
                        </button>
                    </div>
                </div>
            );
        }

        function Projects({ projects }) {
            const getColorClasses = (color) => {
                const colors = {
                    blue: "bg-blue-50 border-blue-200 text-blue-800",
                    purple: "bg-purple-50 border-purple-200 text-purple-800",
                    green: "bg-green-50 border-green-200 text-green-800",
                    orange: "bg-orange-50 border-orange-200 text-orange-800",
                };
                return colors[color] || colors.blue;
            };

            return (
                <div className="max-w-5xl mx-auto animate-fade-in">
                    <h2 className="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                        <span className="bg-green-100 text-green-600 p-2 rounded-lg mr-3">🚀</span>
                        Featured Projects
                    </h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {projects.map(project => (
                            <div key={project.id} className="feature-card bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-full overflow-hidden">
                                {/* Project Header Banner */}
                                <div className={`h-2 w-full ${project.color === 'blue' ? 'bg-blue-500' : project.color === 'purple' ? 'bg-purple-500' : project.color === 'green' ? 'bg-green-500' : 'bg-orange-500'}`}></div>

                                <div className="p-6 flex-1 flex flex-col">
                                    <h3 className="text-xl font-bold text-gray-900 mb-3">{project.title}</h3>
                                    <p className="text-gray-600 leading-relaxed mb-6 flex-1">
                                        {project.description}
                                    </p>

                                    <div className="mb-6">
                                        <div className="flex flex-wrap gap-2">
                                            {project.tags.map((tag, idx) => (
                                                <span key={idx} className={`text-xs px-2 py-1 rounded-md border font-medium ${getColorClasses(project.color)} bg-opacity-50`}>
                                                    {tag}
                                                </span>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex gap-4 pt-4 border-t border-gray-100">
                                        {project.links.map((link, idx) => (
                                            <a key={idx} href={link.url} className={`text-sm font-semibold hover:underline ${project.color === 'blue' ? 'text-blue-600' : project.color === 'purple' ? 'text-purple-600' : project.color === 'green' ? 'text-green-600' : 'text-orange-600'}`}>
                                                {link.label} {link.label === 'Source' ? '</>' : '↗'}
                                            </a>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- MAIN APP ---

        function App() {
            const [activeTab, setActiveTab] = useState('about');

            return (
                <div className="min-h-screen bg-gray-50/50 flex flex-col font-sans">
                    {/* Header */}
                    <header className="bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-800 text-white p-8 shadow-md">
                        <div className="container mx-auto max-w-5xl">
                            <h1 className="text-4xl font-extrabold tracking-tight mb-2">{PORTFOLIO_DATA.about.name}</h1>
                            <p className="text-blue-100 text-lg font-medium opacity-90">{PORTFOLIO_DATA.about.title}</p>
                        </div>
                    </header>

                    {/* Navigation */}
                    <nav className="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10 w-full">
                        <div className="container mx-auto max-w-5xl flex space-x-2 md:space-x-8 px-4 overflow-x-auto">
                            {[
                                { id: 'about', label: 'About Me', icon: '👤' },
                                { id: 'blog', label: 'Blog', icon: '📝' },
                                { id: 'projects', label: 'Projects', icon: '🚀' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`py-4 px-4 font-medium sm:text-lg flex items-center gap-2 whitespace-nowrap transition-colors focus:outline-none ${activeTab === tab.id
                                            ? 'tab-active'
                                            : 'text-gray-500 hover:text-gray-900 border-b-2 border-transparent hover:border-gray-300'
                                        }`}
                                >
                                    <span className="opacity-70">{tab.icon}</span>
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <main className="container mx-auto flex-1 px-4 py-8 md:py-12 max-w-6xl">
                        {activeTab === 'about' && <AboutMe data={PORTFOLIO_DATA.about} />}
                        {activeTab === 'blog' && <Blog posts={PORTFOLIO_DATA.blogPosts} />}
                        {activeTab === 'projects' && <Projects projects={PORTFOLIO_DATA.projects} />}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-gray-200 py-8 text-center text-gray-500 text-sm mt-auto">
                        <p>© {new Date().getFullYear()} {PORTFOLIO_DATA.about.name}. All rights reserved.</p>
                        <p className="mt-2 text-xs">Built with React & Tailwind CSS.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>

</html>
